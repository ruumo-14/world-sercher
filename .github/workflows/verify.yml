name: Verify JavaScript and browser assets
on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find api lib public scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check browser assets and secret boundaries
        run: node scripts/verify-game.js
